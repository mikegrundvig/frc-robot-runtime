// The runtime: the robot program every robot shares, which no team writes, with the simulation it
// runs and the harness a team tests its own robot with. Published as
// com.michaelgrundvig.frc:frc-robot-runtime (gradle/publishing.gradle), which a robot program asks
// for by its version.

pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the JDK the build asks for (java.toolchain), so ./gradlew works on any machine.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "frc-robot-runtime"

// The simulation, a project of its own, which blocks a dependency: it reads the model, and nothing
// of the runtime, localization, or Pitwall. Named for what it's published as, so its test fixtures
// are found by that name too.
include "frc-robot-simulation"
project(":frc-robot-simulation").projectDir = file("lib/simulation")

// The robot model, localization and Pitwall, each a repository of its own, come from the FRC
// libraries' Maven repository at this release's version (build.gradle, gradle/frc-maven.gradle).
//
// Developing them together: -PlocalLibs=<folder> builds those found in that folder's model/,
// localization/ and pitwall/ (each a clone of its repository) from their source, in place of the
// published versions, so a change to one is seen here before it's published. Off unless asked for.
// Only the build that runs reads it: a robot program that includes this build decides for both.
def localLibs = providers.gradleProperty("localLibs").orNull
if (localLibs != null && gradle.parent == null) {
    def folder = new File(localLibs.startsWith("~") ? System.getProperty("user.home") + localLibs.substring(1) : localLibs)
    folder = folder.absolute ? folder : new File(settingsDir, localLibs)
    if (!folder.directory) {
        throw new GradleException("-PlocalLibs=${localLibs} isn't a folder: name the one holding model/, localization/ and pitwall/")
    }
    [
        "model",
        "localization",
        "pitwall"
    ].each { name ->
        def library = new File(folder, name)
        if (new File(library, "settings.gradle").exists()) {
            logger.lifecycle("Building ${name} from ${library} (-PlocalLibs)")
            includeBuild(library) {
                if (name == "model") {
                    // Its processor's project is docs-processor; it's published as frc-docs-processor.
                    dependencySubstitution {
                        substitute module("com.michaelgrundvig.frc:frc-docs-processor") using project(":docs-processor")
                        // Naming one substitution turns off Gradle's automatic ones, so the model is named too.
                        substitute module("com.michaelgrundvig.frc:frc-robot-model") using project(":")
                    }
                }
            }
        }
    }
}

// The build's Gradle plugin for AdvantageScope's robot assets (build-logic/), an included build of
// its own, built, tested and published with this one when this is the build that runs. A robot
// program that builds this one from source (-PlocalLibs) includes build-logic itself, through its
// plugin management, to apply the plugin.
if (gradle.parent == null) {
    includeBuild("build-logic")
}
