// The runtime: the robot program every robot shares, which no team writes. Mechanisms built from a
// robot's definition, the drivetrain, vision, localization's wiring, autos, the loop, the venues,
// the simulator's adapters, and the harness a team tests its own robot with (test fixtures). It
// reads the world model, localization, the simulation and Pitwall, and nothing of the team's robot
// program (frc.robot): the team's Main hands it which robot this is, this season's field and what
// the robot does (RobotProgram.start), and Gradle keeps it so, since the runtime can't see the
// project that depends on it. Its code is in com.michaelgrundvig.frc.runtime.
//
// GradleRIO is applied here, as in a robot program: it gives this build WPILib and the vendor
// libraries in vendordeps/ to compile and test with, and the native libraries the simulator's tests
// load. The runtime borrows them and never bundles them: every robot has its own, and the robot
// program that includes this build must have the same versions (its build checks it).

plugins {
    id "java-library"
    id "java-test-fixtures"
    id "jacoco"
    alias(libs.plugins.gradlerio)
    alias(libs.plugins.spotless)
    alias(libs.plugins.errorprone)
}

// Published as com.michaelgrundvig.frc:frc-robot-runtime (gradle/publishing.gradle, at the end).
group = "com.michaelgrundvig.frc"

// GradleRIO's repositories give WPILib and the vendor libraries; the FRC libraries' own repository
// gives the robot model, localization and Pitwall, at this release's version.
apply from: file("gradle/frc-maven.gradle")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // The libraries the runtime is made of appear in its signatures: the model, localization and
    // Pitwall at this release's version (the catalog's frc-libs), and the simulation, this build's.
    api libs.frc.robot.model
    api libs.frc.localization
    api project(":frc-robot-simulation")
    api libs.frc.pitwall
    api libs.jspecify

    // WPILib, and the vendor libraries in vendordeps/ (Commands v3, AdvantageKit, Phoenix, REVLib,
    // PhotonLib), exactly as GradleRIO gives them to a robot program. The robot program has them
    // at run time; here they compile the runtime, its fixtures and its tests. compileOnly keeps
    // them out of what's published: a program's own GradleRIO and vendordeps decide its versions,
    // and the jar says which this runtime was built with (builtWith, below), for the program's
    // build to compare.
    compileOnly wpi.java.deps.wpilib()
    compileOnly wpi.java.vendor.java()
    testFixturesCompileOnly wpi.java.deps.wpilib()
    testFixturesCompileOnly wpi.java.vendor.java()
    testImplementation wpi.java.deps.wpilib()
    testImplementation wpi.java.vendor.java()
    testRuntimeOnly wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    testRuntimeOnly wpi.java.vendor.jniRelease(wpi.platforms.desktop)

    // The native libraries GradleRIO extracts for the desktop (extractReleaseNative), which the
    // simulation's tests load (lib/simulation/build.gradle).
    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)

    // WPILib's annotations, and AdvantageKit's @AutoLog processor, at the version
    // vendordeps/AdvantageKit.json pins.
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    def akit = new groovy.json.JsonSlurper().parse(file("vendordeps/AdvantageKit.json"))
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:${akit.version}"

    // Configuration records are built by name, through builders generated as they compile, and
    // their Javadoc is written into the jar so Pitwall's page can say what each value means.
    compileOnly libs.recordbuilder.core
    compileOnly libs.errorprone.annotations
    annotationProcessor libs.recordbuilder.processor
    annotationProcessor libs.frc.docs.processor
    testFixturesCompileOnly libs.recordbuilder.core
    testFixturesCompileOnly libs.errorprone.annotations
    testFixturesAnnotationProcessor libs.recordbuilder.processor
    testCompileOnly libs.errorprone.annotations
    testCompileOnly libs.recordbuilder.core
    testAnnotationProcessor libs.recordbuilder.processor

    errorprone libs.errorprone.core
    errorprone libs.nullaway

    // What a team tests its own robot with: the simulator's harness (RobotSim), the monkey, the
    // invariants, the auto check. JUnit's API and AssertJ appear in them; the architecture rules
    // are shared with the team's own architecture test.
    testFixturesApi platform(libs.junit.bom)
    testFixturesApi "org.junit.jupiter:junit-jupiter-api"
    testFixturesApi libs.assertj.core
    testFixturesApi libs.archunit
    // A test that must not share its JVM is run in one of its own by JUnit's launcher (InItsOwnJvm).
    testFixturesImplementation "org.junit.platform:junit-platform-launcher"
    // The truth suite's known gaps, which the simulator's tests share with its library's.
    testFixturesApi testFixtures(project(":frc-robot-simulation"))
    // The localizer contract's conformance suite, for a team that writes a localizer of its own.
    testFixturesApi testFixtures(libs.frc.localization)

    testImplementation platform(libs.junit.bom)
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation libs.assertj.core
    testImplementation libs.archunit
}

tasks.withType(JavaCompile).configureEach {
    // The simulator runs in the robot's process.
    options.compilerArgs.add "-XDstringConcat=inline"
}
tasks.named("compileJava") {
    options.compilerArgs.add "-Apitwall.docs.records=com.michaelgrundvig.frc.world.config.ConfigRecord"
}

// PhotonVision's camera simulation allocates OpenCV frames in native memory that only Java's
// collector frees (each Mat's finalizer), so outside the heap a simulating process grows with how
// seldom the collector runs. A 32 MB young generation runs it often enough (docs/testing.md).
tasks.withType(Test).configureEach { jvmArgs "-Xmn32m" }

// The tests run the robot program's simulation: WPILib's and the vendors' native libraries, which
// GradleRIO extracts, and the JVM options it sets for its tests.
wpi.java.configureTestTasks(test)

// What this runtime was built with: GradleRIO's version and the vendor libraries in vendordeps/,
// written into the jar as META-INF/frc-robot-runtime/built-with.json. A robot program runs the
// runtime with its own WPILib and vendor libraries, which must be these versions; its build reads
// this file from the runtime it resolved and fails when they differ (the template's
// gradle/runtime-versions.gradle). The file travels in the jar, so the check needs nothing of this
// repository but the published runtime.
def builtWithDir = layout.buildDirectory.dir("generated/built-with")
def builtWith = tasks.register("builtWith") {
    description = "Write the GradleRIO and vendor library versions the runtime is built with into its jar."
    def gradleRio = libs.versions.gradlerio.get()
    def vendordeps = fileTree("vendordeps") { include "*.json" }
    inputs.property("gradlerio", gradleRio)
    inputs.files(vendordeps).withPropertyName("vendordeps").withPathSensitivity(PathSensitivity.NAME_ONLY)
    outputs.dir(builtWithDir)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def libraries = vendordeps.files.sort { it.name }.collect { File f ->
            def json = slurper.parse(f)
            [file: f.name, name: json.name, uuid: json.uuid, version: json.version]
        }
        def out = builtWithDir.get().file("META-INF/frc-robot-runtime/built-with.json").asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([gradlerio: gradleRio, vendordeps: libraries])) + "\n"
    }
}
sourceSets.main.resources.srcDir(builtWith)

// The robot model's, localization's and Pitwall's sources, which the guides' examples test reads
// (DocExamplesTest): a library's own clone when it's built from source (-PlocalLibs,
// settings.gradle; or the robot program's, when it builds this one so), and otherwise what its
// published jars hold, unpacked under build/library-sources/<library>: the sources jar (its main
// sources, and its README) and the test sources jar (its tests' and test fixtures' sources).
def includedLibrary = { String name ->
    for (def g = gradle; g != null; g = g.parent) {
        def found = g.includedBuilds.find { it.name == name }
        if (found != null) {
            return found.projectDir
        }
    }
    return null
}
def librarySourceDirs = [:]
def unpackLibraries = []
[model: "frc-robot-model", localization: "frc-localization", pitwall: "frc-pitwall"].each { name, artifact ->
    def local = includedLibrary(name)
    if (local != null) {
        librarySourceDirs[name] = local
        return
    }
    def coordinates = "com.michaelgrundvig.frc:${artifact}:${libs.versions.frc.libs.get()}"
    def sources = configurations.detachedConfiguration(dependencies.create("${coordinates}:sources@jar"))
    def testSources = configurations.detachedConfiguration(dependencies.create("${coordinates}:test-sources@jar"))
    def dir = layout.buildDirectory.dir("library-sources/${name}")
    unpackLibraries << tasks.register("${name}Sources", Sync) {
        description = "Unpack ${artifact}'s published sources, for the guides' examples test."
        from({ zipTree(sources.singleFile) }) {
            exclude "META-INF/**", "README.md"
            into "src/main/java"
        }
        from({ zipTree(sources.singleFile) }) {
            include "README.md"
        }
        from({ zipTree(testSources.singleFile) }) {
            exclude "META-INF/**"
        }
        into dir
    }
    librarySourceDirs[name] = dir.get().asFile
}
def modelDir = librarySourceDirs.model
def localizationDir = librarySourceDirs.localization
def pitwallDir = librarySourceDirs.pitwall

tasks.named("test") {
    useJUnitPlatform()
    // A fresh test JVM every 20 test classes (a robot program's tests do the same).
    forkEvery = 20
    // Tests run in the build folder, so what simulated devices and logs write (CTRE's ctre_sim/,
    // for one) stays out of the project. A test finds project files through frc.projectDir.
    def work = layout.buildDirectory.dir("test-work")
    workingDir = work
    systemProperty "frc.projectDir", projectDir.absolutePath
    // How many seeds MonkeySimTest runs on each robot, or the one seed to run alone, the one a
    // failure names: -PmonkeySeeds=50, -PmonkeySeed=1234 (docs/testing.md).
    ["monkeySeeds", "monkeySeed"].each { name ->
        def value = providers.gradleProperty(name).orNull
        if (value != null) {
            systemProperty "frc.$name", value
        }
    }
    // Project files the tests check against the code, declared so Gradle knows the tests depend
    // on them: the values register (docs/values.md, ValuesRegisterTest) and the guides' examples of
    // code (DocExamplesTest), read as text with the sources they're found in. A quick build
    // (-Pquick) skips tests whose inputs haven't changed, so an undeclared file would let a change
    // to it pass untested. The model's, localization's and Pitwall's are their published sources,
    // unpacked (above).
    dependsOn unpackLibraries
    systemProperty "frc.modelDir", modelDir.absolutePath
    systemProperty "frc.localizationDir", localizationDir.absolutePath
    systemProperty "frc.pitwallDir", pitwallDir.absolutePath
    inputs.files(fileTree("docs") { include "**/*.md" }, "README.md", new File(pitwallDir, "README.md"))
    .withPropertyName("guides").withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.files(
            fileTree("src") { include "*/java/**/*.java" },
            fileTree("lib") { include "*/src/*/java/**/*.java" },
            fileTree(modelDir) { include "src/*/java/**/*.java" },
            fileTree(localizationDir) { include "src/*/java/**/*.java" },
            fileTree(pitwallDir) { include "src/*/java/**/*.java" })
            .withPropertyName("documentedSources").withPathSensitivity(PathSensitivity.NAME_ONLY)
    // GOLDEN_UPDATE=1 has the recorded tests record their recordings again, in src/test/resources,
    // which Gradle doesn't know the tests write: so with it, the tests always run, and never come
    // from the build cache, whatever ran before.
    def goldenUpdate = providers.environmentVariable("GOLDEN_UPDATE").orElse("")
    inputs.property("goldenUpdate", goldenUpdate)
    outputs.upToDateWhen { goldenUpdate.get() != "1" }
    outputs.doNotCacheIf("GOLDEN_UPDATE rewrites src/test/resources") { goldenUpdate.get() == "1" }
    doFirst { work.get().asFile.mkdirs() }
    // ReplayEndToEndTest's robot programs write their coverage beside the tests' own, for the
    // coverage report to count: the program's startup runs nowhere else.
    // It's an output of the tests, said so: restored from the build cache with their own coverage,
    // or the coverage check would count the program's startup as never run.
    def endToEndCoverage = layout.buildDirectory.file("jacoco/end-to-end.exec")
    outputs.file(endToEndCoverage).withPropertyName("endToEndCoverage").optional()
    doFirst { endToEndCoverage.get().asFile.delete() }
}
tasks.named("jacocoTestReport") {
    executionData.from(fileTree(layout.buildDirectory.dir("jacoco")) { include "end-to-end.exec" })
}

// Gradle's configuration cache (gradle.properties) can't hold GradleRIO's own tasks yet: the
// simulator's run, deploy, vendordep, and WPILib's tools. A build that runs one goes without it, as
// every build used to. Marking them incompatible is enough for that; Gradle's internal
// ConfigurationCacheDegradation, where it's there as today, also keeps the problems the cache finds
// in them out of the output, so the build says so in a line. Should it change or go, the build
// works as before and lists them.
def withoutConfigurationCache = { Task task, String why ->
    task.notCompatibleWithConfigurationCache(why)
    try {
        def degrade = Class.forName("org.gradle.api.internal.ConfigurationCacheDegradation").methods.find {
            it.name == "requireDegradation" && it.parameterCount == 2 && it.parameterTypes[1] == String
        }
        degrade?.invoke(null, task, why)
    } catch (Exception | LinkageError ignored) {
        // Marked incompatible above, which is all a build needs.
    }
}
// GradleRIO's tasks that building and testing use work with it.
def cacheable = [
    "extractReleaseNative",
    "extractDebugNative",
    "downloadDepsPreemptively"
]
tasks.configureEach { task ->
    if (task.class.name.startsWith("org.wpilib.") && !(task.name in cacheable)) {
        withoutConfigurationCache(task, "GradleRIO's state can't be kept in the configuration cache")
    }
}

apply from: "gradle/quality.gradle" // formatting, static analysis, coverage, the ci task

ext.published = [
    artifactId: "frc-robot-runtime",
    name: "FRC robot runtime",
    description: "The robot program every robot shares, which no team writes: the loop, the drivetrain, the mechanisms built from a robot's definition, vision and localization's wiring, autos, the simulator's adapters, and the harness a team tests its own robot with.",
    repository: "frc-robot-runtime",
    license: "BSD 3-Clause License",
]
apply from: "gradle/publishing.gradle"
// The plugin (build-logic/) is published with the runtime, when this is the build that runs.
if (gradle.parent == null) {
    tasks.named("publishToFrcMaven") {
        dependsOn gradle.includedBuild("build-logic").task(":publishToFrcMaven")
    }
}
