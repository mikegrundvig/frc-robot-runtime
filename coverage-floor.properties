# Coverage floor (gradle/quality.gradle): the same bar as the robot program's; see its
# coverage-floor.properties. Only this project's own tests count: the team's robots' tests run its
# code too, but the runtime's tests are what show it works on its own, on the guide's robot.
line=50.0
branch=50.0
# Every source file on its own, too: a file with no tests fails the build even while the rest of
# the code carries the total.
file.line=50.0
# RobotProgram.start only hands the program to WPILib (RobotBase.startRobot), which runs until the
# robot stops; tests build the robot other ways (Robot.assemble) and start it as a process
# (ReplayEndToEndTest).
file.exempt=com/michaelgrundvig/frc/runtime/RobotProgram.java
