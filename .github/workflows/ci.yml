name: CI

# Runs ./gradlew ci, the same command anyone runs locally before pushing. Keep the checks in Gradle,
# not here: this file only sets up caching and uploads the results. It runs when started by hand
# (Actions tab, "Run workflow") and on pull requests, not on every push.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Build, check, test
    # Linux only: the runtime and its libraries have no Windows build. A robot program that includes
    # them is built on Windows too, and checks them there as part of its own build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to a commit (the version beside it), so a moved tag can't change what
      # runs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches Gradle, dependencies, and the JDK 25 toolchain Gradle downloads on first use.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache, on GitHub's own actions/cache, rather than the default: a
          # proprietary component under its own terms of use.
          cache-provider: basic
      - name: Formatting, static analysis, tests, coverage
        run: ./gradlew ci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.sha }}
          path: |
            build/reports/
            build/test-results/
            lib/*/build/reports/
            lib/*/build/test-results/
            build-logic/build/reports/
            build-logic/build/test-results/
          if-no-files-found: warn

  siblings:
    name: Build, check, test against the libraries' tips
    # The same ci, with the model, localization and Pitwall built from their default branches' heads
    # in place of the published release (-PlocalLibs, settings.gradle), as a developer builds them
    # together. The job above checks this commit against what is released; this one checks that the
    # four still fit together between releases, so a change in one that breaks another shows here
    # before a release is cut from them.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # The four clones side by side, as -PlocalLibs expects: runtime/, model/, localization/ and
      # pitwall/ in one folder. Each library's own repository, under this one's owner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/frc-robot-model
          path: model
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/frc-localization
          path: localization
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository_owner }}/frc-pitwall
          path: pitwall
      - name: The commits built
        run: |
          for name in runtime model localization pitwall; do
            echo "$name $(git -C "$name" log -1 --format='%h %s')"
          done
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Formatting, static analysis, tests, coverage, against the tips
        working-directory: runtime
        run: ./gradlew ci -PlocalLibs=..
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-siblings-${{ github.sha }}
          path: |
            runtime/build/reports/
            runtime/build/test-results/
            runtime/lib/*/build/reports/
            runtime/lib/*/build/test-results/
            runtime/build-logic/build/reports/
            runtime/build-logic/build/test-results/
          if-no-files-found: warn
