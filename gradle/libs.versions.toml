# Every build and test version in one place. Robot libraries (WPILib, AdvantageKit, vendor
# libraries) are versioned by GradleRIO and vendordeps/ instead, as in any WPILib project.

[versions]
# This release of the FRC libraries (the model, localization, Pitwall, the runtime): what this build
# publishes as (gradle/publishing.gradle), and the version of the model, localization and Pitwall it
# reads. All of them share it, so a release is one change, here.
frc-libs = "2026.11.11"
# Visor, the AprilTag vision program for a coprocessor: its robot client, at Visor's own version.
visor = "2026.11.6"
# Spotter, whose manager watches the coprocessors' agents and installs Visor through them.
spotter = "0.4.0"
gradlerio = "2027.0.0-alpha-7"
# GradleRIO's deploy library, at the version that GradleRIO brings: the Visor deploy plugin
# (build-logic) configures its targets.
deployutils = "2027.2.0"
spotless = "8.11.0"
# The formatters Spotless runs (gradle/quality.gradle), pinned rather than left to Spotless's
# defaults, so a newer Spotless can't reformat the code on its own: a formatter's new version is a
# change of its own, with the reformatting it brings. Dependabot doesn't see them: bump them by hand.
# greclipse is the Eclipse release whose Groovy formatter formats the build files.
google-java-format = "1.36.1"
greclipse = "4.35"
gson = "2.14.0"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
jspecify = "1.0.1"
jacoco = "0.8.15"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
recordbuilder = "53"
# Mutation testing of the simulation (lib/simulation/build.gradle): the plugin, PIT itself, and
# the plugin that lets PIT run JUnit Platform tests.
pitest-plugin = "1.19.0"
pitest-core = "1.30.0"
pitest-junit5 = "1.2.3"

[libraries]
deployutils = { module = "org.wpilib:DeployUtils", version.ref = "deployutils" }
frc-robot-model = { module = "com.michaelgrundvig.frc:frc-robot-model", version.ref = "frc-libs" }
frc-docs-processor = { module = "com.michaelgrundvig.frc:frc-docs-processor", version.ref = "frc-libs" }
frc-localization = { module = "com.michaelgrundvig.frc:frc-localization", version.ref = "frc-libs" }
frc-pitwall = { module = "com.michaelgrundvig.frc:frc-pitwall", version.ref = "frc-libs" }
frc-visor-client = { module = "com.michaelgrundvig.frc:frc-visor-client", version.ref = "visor" }
spotter-manager = { module = "com.michaelgrundvig.frc:spotter-manager", version.ref = "spotter" }
spotter-agent = { module = "com.michaelgrundvig.frc:spotter-agent", version.ref = "spotter" }
recordbuilder-core = { module = "io.soabase.record-builder:record-builder-core", version.ref = "recordbuilder" }
recordbuilder-processor = { module = "io.soabase.record-builder:record-builder-processor", version.ref = "recordbuilder" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
# @CheckReturnValue, which Error Prone reads: a move or a gate made and dropped fails the build.
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[plugins]
gradlerio = { id = "org.wpilib.GradleRIO", version.ref = "gradlerio" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
